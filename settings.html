<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ana ayarlar - Sohbetix</title><link href="styles.css?v=V34-STATIC-FIX" rel="stylesheet"/><meta content="#17102F" name="theme-color"/><link rel="icon" type="image/jpeg" href="sohbetix-logo.jpg"/>
</head>
<body class="admin-page">
<header class="admin-top"><div class="admin-wrap admin-nav"><a class="brand brand-logo-v21" href="index.html" aria-label="Sohbetix"><img src="sohbetix-logo.jpg" alt="Sohbetix"/></a><a class="admin-nav-link active" href="dashboard.html">SOHBET KONTROL PANELİ</a><span class="admin-nav-link disabled">JETONLAR — 🪙 0</span><div class="admin-user">👤 Sohbetix Kullanıcısı ▾</div></div></header>
<main class="admin-main"><div class="admin-wrap">
<div class="admin-breadcrumb"><a class="root" href="dashboard.html">Kontrol paneli</a><span class="sep">→</span><strong>Sohbetix</strong><span class="sep">→</span><span>Ayarlar</span><a class="admin-open-chat" id="settingsOpenChat" href="open-chat.html" target="_blank">↗ Sohbeti aç</a></div>
<div class="admin-tabs"><a class="admin-tab active" href="settings.html">Ana ayarlar</a><a class="admin-tab" href="rooms.html">Odalar</a><a class="admin-tab" href="domain.html">Sohbet adresi (alan adı)</a></div>
<div class="admin-form" id="chatSettingsForm">
<div class="admin-row"><label>Sohbet başlığı</label><input id="cfgTitle" maxlength="60" type="text" value="Sohbetix"/></div>
<div class="admin-row"><label>Varsayılan dil</label><select id="cfgLanguage"><option value="tr">Türkçe</option><option value="en">English</option></select></div>
<div class="admin-row"><label>Varsayılan sekme</label><select disabled><option>Ana sayfa</option></select></div>
<label class="admin-check"><input id="cfgDisabled" type="checkbox"/> Sohbeti geçici olarak devre dışı bırak</label>
<label class="admin-check"><input id="cfgImageShare" type="checkbox"/> Resim paylaşımı</label>
<h2 class="admin-section-title">Özel görüşmeler</h2>
<div class="admin-row"><label>Özel görüşmelere izin verilenler</label><select id="cfgPrivate"><option value="entered">Sohbete girenler</option><option value="registered">Kayıtlı kullanıcılar</option></select></div>
<h2 class="admin-section-title">Sohbet kataloğu</h2>
<label class="admin-check"><input id="cfgCatalogVisible" checked type="checkbox"/> Sohbeti katalogda göster (sohbetix.com/chats/)</label>
<div class="admin-row"><label>Sohbet açıklaması</label><textarea id="cfgDescription" maxlength="300" placeholder="En fazla 300 karakter"></textarea></div>
<div class="admin-row"><label>Katalog bölümü</label><select id="cfgCategory"><option>Arkadaşlık</option><option>Haber</option><option>Eğlence</option><option>Radyo</option><option>Sağlık ve güzellik</option><option>Otomobil</option><option>Spor</option><option>İş</option><option>İnternet</option><option>Ücretsiz</option><option>Sanat</option><option>Paranormal</option><option>Ev ve aile</option><option>Ürün ve hizmetler</option><option>Toplum</option><option>Evcil hayvanlar</option></select></div>
<div class="small-note" id="settingsSaved" hidden>✓ Ayarlar kaydedildi ve sohbet sayfasına uygulanacak.</div>
<button class="admin-save" id="saveChatSettings" type="button">Değişiklikleri kaydet</button>
</div></div></main>
<footer class="admin-footer"><div class="admin-wrap footer-inner"><div>© 2026 Sohbetix</div><select class="lang-switch"><option value="tr">Türkçe</option><option value="en">English</option></select></div></footer>
<script src="app.js?v=V34-STATIC-FIX"></script><script src="v34-core.js?v=V34-STATIC-FIX"></script><script src="presence-bridge.js?v=V34-STATIC-FIX"></script></body></html>
